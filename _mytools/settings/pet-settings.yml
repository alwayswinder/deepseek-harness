# 桌宠便携设置：little-icon 段的一份可移植副本，跟着 git 走。
#
# 本机 → 仓库：双击 save-settings.bat，把本机 profile 的设置抄到这里，
#   然后自己 git add / commit / push。
# 仓库 → 本机：启动 DSH 前由 build\start-desktop.bat 自动合并；只有这份文件
#   变了才会覆盖本机设置，本机自己改过的值会保留到文件下次更新。
# 手改这份文件同样有效：config 段就是设置页里的字段，没写到的字段用插件默认值。

version: 1
exportedFrom: desktop
exportedAt: 2026-10-08T08:06:51.419Z
name: "@local/dsh-little-icon"
config:
  enabled: true
  size: 96
  translucent: false
  idleOpacity: 0.2
  happyMs: 7000
  boredMs: 11000
  sleepWhenHiddenSeconds: 118
  autoHide: false
  autoHideSeconds: 5
  shotDir: D:\AI\Tmp
  sites:
    - name: b站
      url: https://www.bilibili.com/
    - name: git
      url: https://github.com/
    - name: 用量统计
      url: https://platform.deepseek.com/usage
    - name: 翻译
      url: https://translate.google.com/?hl=zh-CN&sl=en&tl=zh-CN&op=translate
    - name: 听歌
      url: https://www.bilibili.com/video/BV1MHeb6nEGx/?trackid=web_pegasus_0.router-web-pegasus-2479516-f6fct.1791446725184.1007&spm_id_from=333.1007.tianma.1-2-2.click&vd_source=f7cf7de90459b8c6a73cd9bdf2093596
  coopAutoStart: false
